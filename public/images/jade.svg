<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">JADE — teaching a language model to choose</title>
  <desc id="desc">A faceted green decision engine connects an input to a set of possible answers, with one path illuminated. Decision Index 0.2.1 score: 53.16.</desc>
