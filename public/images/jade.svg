    <linearGradient id="face" x2="1" y2="1"><stop stop-color="#82f9bd"/><stop offset="1" stop-color="#1c7250"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#080f0b"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1120" cy="425" rx="520" ry="440" fill="url(#glow)"/>
  <g fill="none" stroke="#284437" stroke-width="2">
